version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "gomod"
    directories:
      - "/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directories:
      - "/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directories:
      - "/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directories:
      - "/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
